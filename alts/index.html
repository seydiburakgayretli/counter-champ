<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter Champ – alternatives</title>
    <style>
      body { margin: 0; padding: 16px; background: #1b1d2b; color: #fff; font: 16px system-ui, sans-serif; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p.sub { margin: 0 0 16px; color: #aab; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
      a.card { display: block; padding: 14px; border-radius: 12px; background: #2a2d45; color: inherit; text-decoration: none; }
      a.card:active, a.card:hover { background: #34385a; }
      .top { display: flex; justify-content: space-between; font-size: 12px; color: #aab; text-transform: uppercase; }
      .name { font-weight: 800; font-size: 18px; margin: 6px 0; }
      .s-ready { color: #7cfc9a; } .s-keep { color: #ffd23f; } .s-kill { color: #ff5a5a; } .s-wip, .s-merged { color: #8ecae6; }
    </style>
  </head>
  <body>
    <h1>Counter Champ – alternatives</h1>
    <p class="sub">Play each for 2 minutes, then answer Keep / Kill / Merge in docs/STUDIO.md.</p>
    <div class="grid" id="grid"></div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
